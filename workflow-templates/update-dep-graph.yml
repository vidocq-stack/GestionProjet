# Template à copier dans `.forgejo/workflows/update-dep-graph.yml` de chaque repo
# consommateur (vauban, cassini, champollion, foy, chappe, vidocq, mansart, ...).
#
# Pré-requis : secret `VIDOCQ_BOT_TOKEN` configuré au niveau organisation Forgejo
# avec write sur `vidocq/GestionProjet` et read sur le repo courant.
name: update-dependency-graph
on:
  push:
    branches: [main, master]
    paths:
      - '**/pom.xml'
  workflow_dispatch:

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupère les scripts depuis GestionProjet
        run: |
          curl -fsSL -o /tmp/extract_deps.sh \
            -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
            "https://forge.vidocq.dev/vidocq/GestionProjet/raw/branch/main/scripts/extract_deps.sh"
          curl -fsSL -o /tmp/update_data_file.sh \
            -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
            "https://forge.vidocq.dev/vidocq/GestionProjet/raw/branch/main/scripts/update_data_file.sh"
          chmod +x /tmp/extract_deps.sh /tmp/update_data_file.sh

      - name: Extrait les dépendances `io.vidocq.*`
        run: /tmp/extract_deps.sh "$PWD" "${{ github.repository }}" > /tmp/deps.json

      - name: Affiche le JSON produit (debug)
        run: cat /tmp/deps.json

      - name: Pousse vers GestionProjet/data/
        run: |
          /tmp/update_data_file.sh \
            --repo "${{ github.repository }}" \
            --data-json /tmp/deps.json \
            --token "${{ secrets.VIDOCQ_BOT_TOKEN }}"
