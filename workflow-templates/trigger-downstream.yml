# Template à intégrer dans le workflow CI de chaque repo *producteur* (vauban,
# cassini, champollion, vidocq, mansart, foy, chappe). Les trois jobs ci-dessous
# remplacent une matrice statique par une découverte dynamique via
# `graph/inverted.json`.
#
# Hypothèse : un job `build` existe en amont, qui a publié les artefacts de la PR
# dans le dépôt Maven `pr-staging` et expose son `version` en sortie.
#
# Pré-requis :
#   - secret `VIDOCQ_BOT_TOKEN` (org-level, read sur GestionProjet, dispatch sur autres repos).
#   - `python3` et `jq` disponibles sur le runner self-hosted.
#   - Maven 4 + Java 25 via SDKMAN si on utilise `mvn -Dexec...` pour lister les artefacts.
discover-impact:
  needs: build
  if: github.event_name == 'pull_request'
  runs-on: ubuntu-latest
  outputs:
    matrix: ${{ steps.resolve.outputs.matrix }}
    has_consumers: ${{ steps.resolve.outputs.has_consumers }}
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Récupère le graphe et le résolveur
      run: |
        curl -fsSL -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
          -o /tmp/inverted.json \
          "https://forge.vidocq.dev/vidocq/GestionProjet/raw/branch/main/graph/inverted.json"
        curl -fsSL -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
          -o /tmp/resolve_impact.py \
          "https://forge.vidocq.dev/vidocq/GestionProjet/raw/branch/main/scripts/resolve_impact.py"

    - name: Liste les artefacts produits par ce repo
      id: produced
      run: |
        # Extrait `groupId:artifactId` pour tous les modules du reactor courant.
        # On filtre sur le préfixe `io.vidocq` pour ne pas inclure d'éventuels
        # plugins tiers déclarés dans le pom.
        ARTIFACTS=$(mvn -q -Dexec.executable="echo" \
          -Dexec.args='${project.groupId}:${project.artifactId}' \
          exec:exec 2>/dev/null \
          | grep -E '^io\.vidocq' | sort -u | tr '\n' ' ')
        if [ -z "$ARTIFACTS" ]; then
          echo "Aucun artefact io.vidocq.* détecté — abandon." >&2
          exit 1
        fi
        echo "Produits : $ARTIFACTS"
        echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"

    - name: Résout les consommateurs impactés (fermeture transitive)
      id: resolve
      run: |
        MATRIX=$(python3 /tmp/resolve_impact.py \
          --graph /tmp/inverted.json \
          --changed ${{ steps.produced.outputs.artifacts }} \
          --format matrix)
        echo "Matrice : $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        COUNT=$(echo "$MATRIX" | jq '.include | length')
        if [ "$COUNT" -gt 0 ]; then
          echo "has_consumers=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_consumers=false" >> "$GITHUB_OUTPUT"
        fi

trigger-downstream:
  needs: [build, discover-impact]
  if: needs.discover-impact.outputs.has_consumers == 'true'
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix: ${{ fromJson(needs.discover-impact.outputs.matrix) }}
  steps:
    - name: Dispatch ${{ github.repository }} -> ${{ matrix.repo }}
      run: |
        curl -fsSL -X POST \
          -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
          -H "Content-Type: application/json" \
          "https://forge.vidocq.dev/api/v1/repos/${{ matrix.repo }}/dispatches" \
          -d "$(cat <<JSON
        {
          "event_type": "upstream-pr",
          "client_payload": {
            "upstream_repo": "${{ github.repository }}",
            "upstream_version": "${{ needs.build.outputs.version }}",
            "pr_number": "${{ github.event.number }}",
            "pr_repo": "${{ github.repository }}",
            "pr_sha": "${{ github.event.pull_request.head.sha }}"
          }
        }
        JSON
        )"

verify-downstream:
  needs: [discover-impact, trigger-downstream]
  if: needs.discover-impact.outputs.has_consumers == 'true'
  runs-on: ubuntu-latest
  steps:
    - name: Attend les statuts downstream
      run: |
        SHA="${{ github.event.pull_request.head.sha }}"
        EXPECTED=$(echo '${{ needs.discover-impact.outputs.matrix }}' \
          | jq -r '.include[].repo' | sed 's|.*|downstream/&|')
        echo "Contextes attendus :"
        echo "$EXPECTED"
        for i in $(seq 1 60); do
          STATUSES=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}" \
            "https://forge.vidocq.dev/api/v1/repos/${{ github.repository }}/commits/$SHA/statuses")
          MISSING=0
          for ctx in $EXPECTED; do
            STATE=$(echo "$STATUSES" | jq -r ".[] | select(.context==\"$ctx\") | .state" | head -n1)
            if [ -z "$STATE" ] || [ "$STATE" = "pending" ]; then
              MISSING=1
              break
            fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "Downstream $ctx en échec ($STATE)"
              exit 1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "Tous les statuts downstream sont remontés."
            exit 0
          fi
          sleep 30
        done
        echo "Timeout : certains checks downstream n'ont pas reporté à temps." >&2
        exit 1
